<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OYLA Admin</title><style>*{box-sizing:border-box}body{background:#121416;color:#eee;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:28px}h1 span{color:#ff8834}section,article{background:#202326;border:1px solid #383838;border-radius:18px;padding:22px;margin:15px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #555}input{display:block;width:100%;background:#141618;color:white;margin:8px 0 16px}button{background:#ff8834;color:#161616;cursor:pointer;margin:4px}button.secondary{background:#292b2e;color:white}button:disabled{opacity:.5}p{overflow-wrap:anywhere}a{color:#ff8834}[hidden]{display:none!important}</style><main><h1>OY<span>LA.</span> Admin</h1><a href="./">Басты сайт</a><section id="login"><h2>Әкімші кіруі</h2><form id="form"><label>Электрондық пошта<input id="email" type="email" required autocomplete="username"></label><label>Құпиясөз<input id="password" type="password" required autocomplete="current-password"></label><button>Кіру</button></form></section><p id="status" role="status"></p><section id="panel" hidden><h2>Мұғалімдердің өтінімдері</h2><button id="refresh">Жаңарту</button><button id="logout" class="secondary">Шығу</button><div id="requests"></div></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const c=createClient('https://bgzjnezdtroammgwftsq.supabase.co','sb_publishable_yOe5DzumRzuOLW--0S5Gvw_S9O1sxEY');const e=id=>document.getElementById(id);async function load(){const {data,error}=await c.rpc('oyla_teacher_requests');if(error){e('panel').hidden=true;e('login').hidden=false;e('requests').replaceChildren();e('status').textContent='Әкімші рұқсаты қажет немесе байланыс қатесі.';return;}e('panel').hidden=false;e('login').hidden=true;e('status').textContent='';e('requests').replaceChildren();for(const [key,label] of Object.entries({pending:'Растау күтілуде',approved:'Расталған',rejected:'Қабылданбаған'})){const h=document.createElement('h3');const rows=data.filter(x=>x.status===key);h.textContent=label+' · '+rows.length;e('requests').append(h);for(const row of rows){const a=document.createElement('article');for(const value of [row.name,row.email,row.school]){const p=document.createElement('p');p.textContent=value||'—';a.append(p)}if(key==='pending'){for(const approve of [true,false]){const b=document.createElement('button');b.textContent=approve?'Растау':'Қабылдамау';b.onclick=async()=>{if(!confirm(b.textContent+'?'))return;for(const x of a.querySelectorAll('button'))x.disabled=true;const {error}=await c.rpc('oyla_teacher_decide',{target:row.id,approve});if(error){e('status').textContent='Қате. Қайталап көріңіз.';for(const x of a.querySelectorAll('button'))x.disabled=false;}else await load()};a.append(b)}}e('requests').append(a)}}}e('form').onsubmit=async ev=>{ev.preventDefault();const {error}=await c.auth.signInWithPassword({email:e('email').value.trim(),password:e('password').value});e('password').value='';if(error){e('status').textContent='Кіру сәтсіз.';return}await load()};e('refresh').onclick=load;e('logout').onclick=async()=>{await c.auth.signOut();e('requests').replaceChildren();e('panel').hidden=true;e('login').hidden=false;};const {data}=await c.auth.getSession();if(data.session)await load();</script></html>
